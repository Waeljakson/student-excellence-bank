name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore Vite source index
        run: cp source-index.html index.html
      - name: Install dependencies
        run: npm install --include=dev
      - name: Verify reusable print/export safety rules
        run: node scripts/assert-print-safety.mjs
      - name: Smoke-test A4 report printing in a real browser
        run: node scripts/smoke-print-a4.mjs
      - name: Verify grade-scoped secondary notices and subject coverage
        run: node scripts/assert-secondary-notices.mjs
      - name: Type-check and build SPA
        run: npm run build

# Rifq final verification trigger
