name: Apply targeted database migration

on:
  push:
    branches: [main]
    paths:
      - "database/20261005_roles_competition_results.sql"

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      NEON_POSTGRES_URL: ${{ secrets.NEON_POSTGRES_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply migration
        shell: bash
        run: |
          set -euo pipefail
          DB="${DATABASE_URL:-}"
          if [ -z "$DB" ]; then DB="${NEON_DATABASE_URL:-}"; fi
          if [ -z "$DB" ]; then DB="${POSTGRES_URL:-}"; fi
          if [ -z "$DB" ]; then DB="${NEON_POSTGRES_URL:-}"; fi
          if [ -z "$DB" ]; then
            echo "::error::No PostgreSQL connection secret is configured (DATABASE_URL / NEON_DATABASE_URL / POSTGRES_URL / NEON_POSTGRES_URL)."
            exit 2
          fi
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y postgresql-client
          fi
          psql "$DB" -v ON_ERROR_STOP=1 -f database/20261005_roles_competition_results.sql
