name: Apply Neon student-exit migration

on:
  push:
    branches: [main]
    paths:
      - "database/20261005_student_class_exit_tracking.sql"
      - "database/20261005_auto_lesson_attendance.sql"
      - "database/20261005_student_exit_feature_toggle.sql"
      - "database/20261005_student_exit_feature_bridge.sql"
      - "database/20261006_vice_guidance_stage_scope.sql"
      - "database/20261006_referral_action_stage_scope.sql"
      - ".github/workflows/neon-student-exit-migration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Database secret status
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::Repository secret DATABASE_URL is not configured. Neon migration is skipped; the app will continue using the compatibility fallback."
          else
            echo "DATABASE_URL is configured; Neon migration will run."
          fi

      - name: Verify Neon branch matches Data API
        if: env.DATABASE_URL != ''
        shell: bash
        run: |
          python - <<'PY'
          import os, urllib.parse, sys
          u=urllib.parse.urlparse(os.environ["DATABASE_URL"])
          host=(u.hostname or "")
          expected="ep-green-bar-b2rjvdpo"
          if expected not in host:
              print(f"::error::DATABASE_URL points to a different Neon branch host: {host}")
              sys.exit(1)
          print("DATABASE_URL branch matches the application's Neon Data API branch.")
          PY

      - name: Install PostgreSQL client
        if: env.DATABASE_URL != ''
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi

      - name: Apply migration to Neon
        if: env.DATABASE_URL != ''
        shell: bash
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/20261005_student_class_exit_tracking.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/20261005_auto_lesson_attendance.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/20261005_student_exit_feature_toggle.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/20261005_student_exit_feature_bridge.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/20261006_vice_guidance_stage_scope.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/20261006_referral_action_stage_scope.sql

      - name: Force Neon Data API schema refresh
        if: env.DATABASE_URL != ''
        shell: bash
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "NOTIFY pgrst, 'reload schema';"
          sleep 4
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT pg_notify('pgrst','reload schema');"
          sleep 4

      - name: Probe Neon Data API cached admin RPC
        if: env.DATABASE_URL != ''
        shell: bash
        run: |
          set +e
          echo "Probing api_admin_point_rules through Neon Data API..."
          curl -sS -D /tmp/rpc-headers.txt -o /tmp/rpc-body.txt             -X POST "https://ep-green-bar-b2rjvdpo.apirest.c-6.eu-central-1.aws.neon.tech/excellence_bank/rest/v1/rpc/api_admin_point_rules"             -H "Content-Type: application/json"             --data '{}'
          cat /tmp/rpc-headers.txt
          cat /tmp/rpc-body.txt
          echo
          if grep -Eq 'PGRST202|Could not find the function|schema cache' /tmp/rpc-body.txt; then
            echo "::error::Neon Data API still does not expose api_admin_point_rules in schema cache."
            exit 1
          fi
          echo "Data API recognizes api_admin_point_rules (authentication may still be required, which is expected)."
          exit 0

      - name: Verify exit tracking objects
        if: env.DATABASE_URL != ''
        shell: bash
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          SELECT to_regclass('public.student_class_exit_events') AS exit_events_table;
          SELECT to_regclass('public.student_lesson_absence_events') AS absence_events_table;
          SELECT to_regclass('public.school_feature_settings') AS feature_settings_table;
          SELECT s.name_ar,fs.student_exit_enabled,fs.updated_by IS NOT NULL AS manually_changed
          FROM public.school_feature_settings fs
          JOIN public.schools s ON s.id=fs.school_id
          ORDER BY s.name_ar;
          SELECT
            au.id AS user_id,
            au.full_name_ar AS app_name,
            sd.id AS staff_id,
            sd.full_name_ar AS staff_name,
            sd.job_title_ar,
            sd.specialty_ar,
            sd.teaching_subject_ar,
            array_agg(DISTINCT ur.role::text) FILTER (WHERE ur.role IS NOT NULL) AS roles,
            array_agg(DISTINCT d.name_ar) FILTER (WHERE d.id IS NOT NULL) AS assigned_departments,
            array_agg(DISTINCT (g.name_ar||' / '||c.name_ar)) FILTER (WHERE c.id IS NOT NULL) AS assigned_classes
          FROM public.app_users au
          LEFT JOIN public.staff_directory sd ON sd.linked_app_user_id=au.id AND sd.is_active=true
          LEFT JOIN public.user_roles ur ON ur.user_id=au.id
          LEFT JOIN public.teacher_class_assignments tca ON tca.user_id=au.id AND tca.is_active=true
          LEFT JOIN public.classes c ON c.id=tca.class_id
          LEFT JOIN public.grades g ON g.id=c.grade_id
          LEFT JOIN public.departments d ON d.id=g.department_id
          WHERE au.is_active=true
            AND (
              au.full_name_ar ILIKE '%محمد علي عبدالعظيم%'
              OR au.full_name_ar ILIKE '%محمد حجاج%'
              OR au.full_name_ar ILIKE '%محمد صلاح%'
              OR sd.full_name_ar ILIKE '%محمد علي عبدالعظيم%'
              OR sd.full_name_ar ILIKE '%محمد حجاج%'
              OR sd.full_name_ar ILIKE '%محمد صلاح%'
            )
          GROUP BY au.id,au.full_name_ar,sd.id,sd.full_name_ar,sd.job_title_ar,sd.specialty_ar,sd.teaching_subject_ar
          ORDER BY au.full_name_ar;

          SELECT
            sd.id AS staff_id,
            sd.full_name_ar,
            sd.job_title_ar,
            sd.specialty_ar,
            sd.teaching_subject_ar,
            sd.linked_app_user_id,
            au.full_name_ar AS account_name,
            array_agg(DISTINCT ur.role::text) FILTER (WHERE ur.role IS NOT NULL) AS roles,
            array_agg(DISTINCT d.name_ar) FILTER (WHERE d.id IS NOT NULL) AS assigned_departments,
            array_agg(DISTINCT (g.name_ar||' / '||c.name_ar)) FILTER (WHERE c.id IS NOT NULL) AS assigned_classes
          FROM public.staff_directory sd
          LEFT JOIN public.app_users au ON au.id=sd.linked_app_user_id
          LEFT JOIN public.user_roles ur ON ur.user_id=sd.linked_app_user_id
          LEFT JOIN public.teacher_class_assignments tca ON tca.user_id=sd.linked_app_user_id AND tca.is_active=true
          LEFT JOIN public.classes c ON c.id=tca.class_id
          LEFT JOIN public.grades g ON g.id=c.grade_id
          LEFT JOIN public.departments d ON d.id=g.department_id
          WHERE sd.is_active=true
            AND (
              sd.job_title_ar ILIKE '%وكيل%'
              OR sd.full_name_ar ILIKE '%حجاج%'
            )
          GROUP BY sd.id,sd.full_name_ar,sd.job_title_ar,sd.specialty_ar,sd.teaching_subject_ar,sd.linked_app_user_id,au.full_name_ar
          ORDER BY sd.full_name_ar;

          SELECT pg_get_functiondef(p.oid)
          FROM pg_proc p
          JOIN pg_namespace n ON n.oid=p.pronamespace
          WHERE n.nspname='public'
            AND p.proname IN (
              'api_admin_point_rules',
              'api_admin_set_point_rule',
              'api_student_referrals',
              'api_teacher_followup_data',
              'api_referral_deduct_points',
              'api_complete_student_referral',
              'api_return_student_referral_to_teacher',
              'api_forward_returned_referral_to_vice'
            )
          ORDER BY p.proname;
          SELECT proname
          FROM pg_proc
          WHERE proname IN (
            'api_teacher_student_exit_data',
            'api_teacher_student_exit_action',
            'api_guardian_student_exit_today',
            'api_admin_student_exit_analytics',
            'api_teacher_student_absence_action',
            'mishkat_lesson_no_at',
            'api_student_exit_feature_status',
            'api_admin_set_student_exit_feature'
          )
          ORDER BY proname;
          SQL
