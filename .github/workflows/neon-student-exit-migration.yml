name: Apply Neon student-exit migration

on:
  push:
    branches: [main]
    paths:
      - "database/20261005_student_class_exit_tracking.sql"
      - "database/20261005_auto_lesson_attendance.sql"
      - "database/20261005_student_exit_feature_toggle.sql"
      - ".github/workflows/neon-student-exit-migration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Database secret status
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::Repository secret DATABASE_URL is not configured. Neon migration is skipped; the app will continue using the compatibility fallback."
          else
            echo "DATABASE_URL is configured; Neon migration will run."
          fi

      - name: Verify Neon branch matches Data API
        if: env.DATABASE_URL != ''
        shell: bash
        run: |
          python - <<'PY'
          import os, urllib.parse, sys
          u=urllib.parse.urlparse(os.environ["DATABASE_URL"])
          host=(u.hostname or "")
          expected="ep-green-bar-b2rjvdpo"
          if expected not in host:
              print(f"::error::DATABASE_URL points to a different Neon branch host: {host}")
              sys.exit(1)
          print("DATABASE_URL branch matches the application's Neon Data API branch.")
          PY

      - name: Install PostgreSQL client
        if: env.DATABASE_URL != ''
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi

      - name: Apply migration to Neon
        if: env.DATABASE_URL != ''
        shell: bash
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/20261005_student_class_exit_tracking.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/20261005_auto_lesson_attendance.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/20261005_student_exit_feature_toggle.sql

      - name: Force Neon Data API schema refresh
        if: env.DATABASE_URL != ''
        shell: bash
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "NOTIFY pgrst, 'reload schema';"
          sleep 4
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT pg_notify('pgrst','reload schema');"
          sleep 4

      - name: Verify exit tracking objects
        if: env.DATABASE_URL != ''
        shell: bash
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          SELECT to_regclass('public.student_class_exit_events') AS exit_events_table;
          SELECT to_regclass('public.student_lesson_absence_events') AS absence_events_table;
          SELECT to_regclass('public.school_feature_settings') AS feature_settings_table;
          SELECT proname
          FROM pg_proc
          WHERE proname IN (
            'api_teacher_student_exit_data',
            'api_teacher_student_exit_action',
            'api_guardian_student_exit_today',
            'api_admin_student_exit_analytics',
            'api_teacher_student_absence_action',
            'mishkat_lesson_no_at',
            'api_student_exit_feature_status',
            'api_admin_set_student_exit_feature'
          )
          ORDER BY proname;
          SQL
