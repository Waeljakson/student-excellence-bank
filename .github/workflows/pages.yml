name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore Vite source index
        run: cp source-index.html index.html

      - name: Install dependencies
        run: npm install --include=dev

      - name: Build production site
        run: npm run build

      - name: Keep compiled site in main root for legacy Pages mode
        run: |
          cp dist/index.html index.html
          rm -rf assets
          cp -R dist/assets assets
          cp dist/school-logo.png school-logo.png
          cp dist/guidance-logo.png guidance-logo.png
          cp dist/manifest.webmanifest manifest.webmanifest
          cp dist/sw.js sw.js
          touch .nojekyll

      - name: Commit compiled Pages files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets .nojekyll school-logo.png guidance-logo.png manifest.webmanifest sw.js src/App.tsx
          if ! git diff --cached --quiet; then
            git commit -m "Publish compiled GitHub Pages"
            git push origin HEAD:main
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Request legacy Pages rebuild if branch publishing is enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/pages/builds || true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy compiled artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
