name: Source Backup Artifact

on:
  push:
    branches: [backup-artifact-20260915]
    paths:
      - '.github/workflows/source-backup.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Create complete source ZIP
        run: |
          zip -qr student-excellence-bank-full-source-2026-09-15.zip . \
            -x '.git/*' 'node_modules/*' 'dist/*' '*.zip'

      - name: Upload backup ZIP
        uses: actions/upload-artifact@v4
        with:
          name: student-excellence-bank-full-source-2026-09-15
          path: student-excellence-bank-full-source-2026-09-15.zip
          if-no-files-found: error
          retention-days: 30
