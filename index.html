<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta id="app-theme-color" name="theme-color" content="#0b3a65" />

    <meta name="apple-mobile-web-app-capable" content="yes" />

    <link rel="apple-touch-icon" href="/student-excellence-bank/school-logo.png" />
    <title>بنك التميز الطلابي</title>
    <script>
      (() => {
        const isParentPortal = new URLSearchParams(window.location.search).get("parent") === "1";
        const manifest = document.createElement("link");
        manifest.rel = "manifest";
        manifest.href = isParentPortal
          ? "/student-excellence-bank/parent-manifest.webmanifest"
          : "/student-excellence-bank/manifest.webmanifest";
        document.head.appendChild(manifest);

        if (isParentPortal) {
          document.title = "بوابة ولي الأمر - مشكاة الشعلة";
          document.getElementById("apple-app-title")?.setAttribute("content", "ولي الأمر");
          document.getElementById("app-description")?.setAttribute("content", "بوابة ولي الأمر - متوسطة وثانوية مشكاة الشعلة");
          document.getElementById("app-theme-color")?.setAttribute("content", "#0b6b58");
        }
      })();
    </script>
    <script type="module" crossorigin src="/student-excellence-bank/assets/index-D54FC0dF.js"></script>
    <link rel="stylesheet" crossorigin href="/student-excellence-bank/assets/index-Cp_eNFMK.css">
